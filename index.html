<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>マーケット朝刊</title>
<style>
  :root { --bg: #f6f7f9; --panel: #ffffff; --fg: #1b1e24; --muted: #646b78; --line: #e2e5ea; --accent: #2f5bd3; color-scheme: light;
    --sans: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic", Meiryo, sans-serif;
    --serif: "Hiragino Mincho ProN", "Yu Mincho", "Noto Serif JP", serif; }
  @media (prefers-color-scheme: dark) { :root { --bg: #14161a; --panel: #1c1f25; --fg: #e9ebef; --muted: #9aa1ad; --line: #2c3038; --accent: #7b9dff; color-scheme: dark; } }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--sans); font-size: 15px; line-height: 1.7; }
  .wrap { max-width: 720px; margin: 0 auto; display: grid; gap: 20px;
    padding-top: max(24px, env(safe-area-inset-top)); padding-bottom: max(32px, env(safe-area-inset-bottom));
    padding-left: max(16px, env(safe-area-inset-left)); padding-right: max(16px, env(safe-area-inset-right)); }
  h1 { margin: 0; font-family: var(--serif); font-weight: 400; font-size: 28px; }
  h2 { margin: 0; font-size: 16px; }
  p { margin: 0; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px; display: grid; gap: 10px; }
  .note { color: var(--muted); font-size: 13px; }
  .row { display: flex; gap: 8px; }
  input { flex: 1 1 auto; min-width: 0; font: inherit; font-size: 16px; padding: 8px 12px; border: 1px solid var(--line); border-radius: 999px; background: var(--bg); color: var(--fg); }
  button { font: inherit; border: 1px solid var(--fg); background: var(--fg); color: var(--bg); border-radius: 999px; padding: 6px 16px; cursor: pointer; }
  input:focus-visible, button:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .links { display: flex; flex-wrap: wrap; gap: 8px; }
  .links a { text-decoration: none; border: 1px solid var(--line); border-radius: 999px; padding: 6px 14px; font-size: 14px; color: var(--fg); background: var(--bg); }
  .links a::after { content: " ↗"; font-size: 11px; opacity: .7; }
  .links a:hover { border-color: var(--fg); }
  #out:empty { display: none; }
</style>
</head>
<body>
<main class="wrap">
  <h1>マーケット朝刊</h1>
  <div class="card">
    <h2>このページについて</h2>
    <p>株価やニュースのまとめは、自分専用の Google スプレッドシートに移しました。各サイトの利用規約に合わせ、このページには株価やニュースのデータを載せていません。</p>
    <p class="note">スプレッドシートは Google ドライブの「マーケット朝刊（ポートフォリオ）」から開けます。</p>
  </div>
  <div class="card">
    <h2>会社のページを開く</h2>
    <p class="note">証券コード（4けた。例：7203）を入れると、各サイトのその会社のページへのボタンが出ます。会社名なら Yahoo!ファイナンスの検索を開きます。</p>
    <div class="row">
      <input id="q" type="search" inputmode="search" autocomplete="off" placeholder="証券コードか会社名" enterkeyhint="search" aria-label="証券コードか会社名">
      <button type="button" id="go">開く</button>
    </div>
    <div class="links" id="out" aria-live="polite"></div>
  </div>
</main>
<script>
(function () {
  var q = document.getElementById('q'), out = document.getElementById('out');
  function link(text, href) { var a = document.createElement('a'); a.textContent = text; a.href = href; a.target = '_blank'; a.rel = 'noopener noreferrer'; return a; }
  function go() {
    var v = String(q.value || '').replace(/[０-９Ａ-Ｚａ-ｚ]/g, function (c) { return String.fromCharCode(c.charCodeAt(0) - 0xFEE0); }).trim();
    while (out.firstChild) out.removeChild(out.firstChild);
    if (!v) return;
    var m = v.toUpperCase().match(/^(\d{3}[0-9A-Z])$/);
    if (m) {
      var c = m[1];
      out.appendChild(link('株価・チャート（Yahoo!ファイナンス）', 'https://finance.yahoo.co.jp/quote/' + c + '.T'));
      out.appendChild(link('ニュース', 'https://finance.yahoo.co.jp/quote/' + c + '.T/news'));
      out.appendChild(link('決算・業績', 'https://finance.yahoo.co.jp/quote/' + c + '.T/performance'));
      out.appendChild(link('予想・目標株価（みんかぶ）', 'https://minkabu.jp/stock/' + c));
      out.appendChild(link('株探', 'https://kabutan.jp/stock/?code=' + c));
    } else {
      out.appendChild(link('Yahoo!ファイナンスで「' + v + '」を検索', 'https://finance.yahoo.co.jp/search/?query=' + encodeURIComponent(v)));
    }
  }
  document.getElementById('go').addEventListener('click', go);
  q.addEventListener('keydown', function (e) { if (e.key === 'Enter' && !e.isComposing) { e.preventDefault(); go(); } });
})();
</script>
</body>
</html>
